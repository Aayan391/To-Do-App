<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>To Do list</title>
    
</head>
<body>
<div class="main">
    <h1>To Do List</h1>
    <div class="task-section">
        <input type="text" placeholder="Enter Task" id="input-section">
        <select  id="Category">
            <option value="work">Work</option>
                 <option value="study">Study</option>
                      <option value="personal">Personal</option>
        </select>

        <button class="addbtn">Add Task</button>
    </div>
    <div class="task-buttons">
        <button onclick="taskButton('all')">All</button>
         <button onclick="taskButton('completed')">completed</button>
          <button onclick="taskButton('Pending')">Pending</button>
    </div>
    <ul class="task-list">
    </ul>
   
    

</body>
<script src="script.js"></script>
</html>
